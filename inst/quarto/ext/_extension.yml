title: Public Health Wales
author: phwstyle
version: 0.1.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    common:
      lang: en-GB
      fig-width: 7.5
      fig-height: 4.5
      fig-cap-location: top
      tbl-cap-location: top
      knitr:
        opts_chunk:
          dev: ragg_png
          dpi: 200
    html:
      theme: [cosmo, phw.scss]
      css: phw-fonts.css
      include-before-body: phw-band.html
      toc: true
      toc-location: left
      number-sections: false
      code-fold: true
    dashboard:
      theme: [cosmo, phw.scss, phw-dashboard.scss]
      css: phw-fonts.css
      logo: phw-logo-white.svg
      nav-buttons: []
      format-resources:
        - phw-logo-white.svg
    revealjs:
      theme: [default, phw-revealjs.scss]
      css: phw-fonts.css
      logo: phw-logo-blue.svg
      footer: "Iechyd Cyhoeddus Cymru | Public Health Wales"
      slide-number: c/t
      transition: none
      width: 1280
      height: 720
      title-slide-attributes:
        data-background-image: cover-wide.jpg
        data-background-size: cover
      format-resources:
        - phw-logo-blue.svg
        - phw-logo-white.svg
        - cover-wide.jpg
    docx:
      reference-doc: phw-reference.docx
      toc: false
      number-sections: false
      fig-dpi: 300
    pptx:
      reference-doc: phw-reference.pptx
      fig-dpi: 200
    typst:
      template-partials:
        - typst-template.typ
        - typst-show.typ
      font-paths: [_extensions/phw/fonts]
      papersize: a4
      section-numbering: "1.1"
      fig-dpi: 300
      format-resources:
        - phw-logo-white.svg
        - phw-logo-blue.svg
        - cover-a4.jpg
    pdf:
      pdf-engine: xelatex
      documentclass: article
      fontsize: 11pt
      geometry: [a4paper, top=3.2cm, bottom=2.6cm, left=2cm, right=2cm]
      number-sections: true
      colorlinks: true
      include-in-header: phw-header.tex
      fig-dpi: 300
      format-resources:
        - header-band-logo.png
        - cover-a4.jpg
        - phw-logo-white.png
