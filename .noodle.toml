# Auto: the loop schedules and dispatches on its own. Changes reach main only
# through GitHub pull requests (execute opens one, verify reviews it, ship
# merges it), so the loop's own worktree merges are always empty.
mode = "auto"

[routing.defaults]
provider = "claude"
model = "claude-opus-5-5"

[skills]
paths = [".agents/skills"]

# Two slots: a live schedule session counts as an active session, so one slot
# is the scheduler's and the other runs a worker stage. The config does not
# limit the loop to one fix at a time. The schedule skill does that, by
# queueing one issue order at a time and never a sweep beside it.
[concurrency]
max_concurrency = 2

[server]
enabled = false

[adapters.backlog.scripts]
sync = "adapters/backlog-sync"
add = "adapters/backlog-add"
done = "adapters/backlog-done"
edit = "adapters/backlog-edit"
