url: https://ch3w3y.github.io/phwstyle-r/

template:
  bootstrap: 5
  bslib:
    primary: "#285087"
    secondary: "#24A2B5"
    link-color: "#285087"
    base_font: {google: "Ubuntu"}
    heading_font: {google: "Ubuntu"}
    code_font: {google: "Ubuntu Mono"}
    navbar-bg: "#285087"

navbar:
  bg: primary
  structure:
    left: [intro, reference, articles, gallery, news]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Charts
        href: articles/charts.html
      - text: Colours and accessibility
        href: articles/colours.html
      - text: Tables from raw data
        href: articles/tables.html
      - text: Maps and boundaries
        href: articles/maps.html
      - text: Reports and documents
        href: articles/documents.html
      - text: Excel, PowerPoint, Word and interactive tables
        href: articles/exporting.html
      - text: -------
      - text: All articles
        href: articles/index.html
    gallery:
      text: Gallery
      href: articles/gallery.html

home:
  title: phwstyle - Public Health Wales styling for R outputs

reference:
- title: Setup
  desc: Check what each output needs, and install fonts and logos.
  contents:
  - phw_setup_check
  - phw_install_fonts
  - phw_register_fonts
  - phw_font
  - phw_font_dependency
  - phw_download_logos
  - phw_has_logo
  - phw_logo
  - phw_graphic

- title: Colours and palettes
  desc: >
    Brand colours, palettes, the default palette, and colour keys that keep
    each group the same colour across charts and reports.
  contents:
  - phw_colours
  - phw_col
  - phw_pal
  - phw_pal_fun
  - phw_palettes
  - phw_default_palette
  - show_phw_palettes
  - phw_colour_key
  - phw_key

- title: Accessibility
  desc: >
    Switch every chart, table and widget to the colour-blind safe palette,
    check colours for contrast and colour blindness, and give groups a second
    cue besides colour.
  contents:
  - phw_default_palette
  - phw_check_colours
  - phw_contrast
  - phw_text_on
  - phw_cvd
  - scale_shape_phw

- title: ggplot2 charts
  desc: >
    Style every plot with `use_phw_ggplot()`, or one plot with `theme_phw()`
    and the PHW scales. Then add a second axis, a logo footer, or save at
    report size.
  contents:
  - use_phw_ggplot
  - theme_phw
  - theme_phw_map
  - phw_scales
  - phw_sec_axis
  - phw_finalise
  - phw_save
  - phw_style_extensions

- title: Multi-plot figures
  desc: Several charts in one figure with one title and source line.
  contents:
  - phw_arrange
  - phw_title_grob

- title: Public health charts
  desc: Ready-made ggplots for surveillance and quality improvement.
  contents:
  - phw_epicurve
  - phw_pyramid
  - phw_funnel
  - phw_forest
  - phw_spc

- title: Maps
  desc: Boundaries for every level of Welsh geography, and interactive maps.
  contents:
  - phw_boundaries
  - phw_boundary_levels
  - phw_boundaries_cache
  - phw_map
  - phw_leaflet

- title: Building tables
  desc: Build a table once from a data frame, then render it with any table package.
  contents:
  - phw_summary_table
  - phw_as_summary
  - phw_crosstab
  - phw_rate_table
  - phw_poisson_ci
  - phw_risk_table
  - phw_group_table

- title: flextable (Word, PDF, PowerPoint)
  desc: >
    Render a data frame or a summary table as a styled flextable, colour
    cells by value or group, and add in-cell bars.
  contents:
  - phw_flextable
  - phw_flextable_theme
  - use_phw_flextable
  - phw_flextable_heat
  - phw_flextable_bars
  - phw_flextable_groups

- title: gt and gtsummary
  desc: The same tables rendered with gt, and a theme for every gtsummary table.
  contents:
  - phw_gt_theme
  - use_phw_gtsummary

- title: Interactive HTML
  desc: >
    Sortable tables and charts you can hover over, for HTML reports,
    dashboards and Shiny. They can't go in Word or PDF.
  contents:
  - phw_reactable
  - phw_reactable_theme
  - phw_reactable_columns
  - phw_datatable
  - phw_plotly
  - phw_plotly_colorscale

- title: Excel and PowerPoint
  desc: Tables written to Excel sheets, and slides with charts and tables.
  contents:
  - phw_write_xlsx
  - phw_pptx

- title: Captions, dates and numbers
  desc: Source lines, dates and number formats written the PHW way. Every word can be changed.
  contents:
  - phw_caption
  - phw_date
  - phw_number

- title: Documents
  desc: R Markdown formats (HTML, Word, PDF), the Quarto extension and the files behind them.
  contents:
  - phw_formats
  - use_phw_quarto
  - phw_reference_docx
  - phw_reference_pptx
  - phw_latex_header

- title: Shiny and bslib
  desc: A Bootstrap theme, header band and complete page for Shiny apps.
  contents:
  - phw_bs_theme
  - phw_page_navbar
  - phw_header

- title: Package
  desc: An overview of the package and its options.
  contents:
  - phwstyle-package

articles:
- title: Guides
  contents:
  - phwstyle
  - articles/charts
  - articles/colours
  - articles/tables
  - articles/maps
  - articles/documents
  - articles/exporting
- title: Gallery
  desc: Every kind of output, with the functions behind each one.
  contents:
  - articles/gallery
