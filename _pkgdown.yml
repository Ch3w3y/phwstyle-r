url: https://ch3w3y.github.io/phwstyle-r/

template:
  bootstrap: 5
  bslib:
    primary: "#285087"
    secondary: "#24A2B5"
    link-color: "#285087"
    base_font: {google: "Ubuntu"}
    heading_font: {google: "Ubuntu"}
    code_font: {google: "Ubuntu Mono"}
    navbar-bg: "#285087"

navbar:
  bg: primary
  structure:
    left: [intro, reference, articles, gallery, news]
    right: [search, github]
  components:
    gallery:
      text: Gallery
      href: articles/gallery.html

home:
  title: phwstyle - Public Health Wales styling for R outputs

