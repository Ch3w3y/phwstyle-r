# Runs R CMD check (with the tests). Based on r-lib/actions.
#
# Which jobs run:
#
# * Pull requests: the three jobs marked "pr" in .github/ci-matrix.json
#   (Linux with LaTeX, Windows, and the oldest versions), and only when
#   the pull request changes a file that goes into the package (anything
#   .Rbuildignore keeps), this workflow, ci-matrix.json or
#   .github/scripts/package-files.pl. A pull request that changes
#   only the loop's skills, brain notes, the gallery or data-raw runs the
#   "Choose jobs" job alone. A new push cancels the run before it.
# * Every Monday, on demand (Actions > R-CMD-check > Run workflow), and
#   before a release: every job in .github/ci-matrix.json.
# * Pushes to main run nothing here. Each pull request was checked against
#   main as it was then; two pull requests merged close together are only
#   checked together by the next full run. The pkgdown workflow still
#   builds the site from main.
# * Boundary updates (update-boundaries.yaml) start a full run on their
#   branch, because a pull request opened by a workflow triggers none.
#
# The jobs in .github/ci-matrix.json:
#
# Analysts don't all have the same versions of R, of the packages phwstyle
# uses, or of the document tools, and phwstyle takes different routes
# depending on what is installed (most of all for ggplot2 before and after
# 4.0). So the jobs cover versions as well as platforms:
#
# * Platforms: the latest of everything on Linux, macOS and Windows, and
#   older R on Windows, which is what most analysts use.
# * R versions: R devel, the release, the two releases before it, and the
#   minimum in DESCRIPTION (R 4.3), all with the latest packages available
#   for that R. R 4.3 is the minimum because it is the oldest R whose CRAN
#   Windows binaries meet every minimum version in DESCRIPTION. When a new
#   R is released, add a job for any version between the minimum and
#   oldrel-2.
# * "ggplot2 3.5": the latest of everything else with ggplot2 3.5.2, the
#   last release before 4.0.
# * "CRAN <date>": a version of R with every package as it was on CRAN that
#   day, and the Quarto and Pandoc of the time. This is what a machine set
#   up then and not updated since has. The first of them, "oldest", is the
#   minimum versions in DESCRIPTION, with ggplot2 3.5.0. If you raise a
#   minimum there, move its `snapshot` to a date when that version was on
#   CRAN (and keep `r` to a version of R that was current then).
# * "ggplot2 dev": the development version of ggplot2, as an early warning.
#   It is allowed to fail.
#
# data-raw/version-battery/battery.sh runs the same cells on one machine,
# with more versions of Pandoc and Quarto.
on:
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Choose jobs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          filter='.'
          if [ "$EVENT" = pull_request ]; then
            changed=$(git -c core.quotePath=false diff --name-only --no-renames "$BASE...$HEAD")
            package=$(printf '%s\n' "$changed" | perl .github/scripts/package-files.pl)
            ci=$(printf '%s\n' "$changed" | grep -E '^\.github/(workflows/R-CMD-check\.yaml|ci-matrix\.json|scripts/package-files\.pl)$' || true)
            relevant=$(printf '%s\n' "$package" "$ci" | sed '/^$/d')
            if [ -n "$relevant" ]; then
              filter='[.[] | select(.pr)]'
              { echo "Files that need the check:"; echo '```'; echo "$relevant"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            else
              filter='[]'
              echo "No file in this pull request goes into the package, so the check is skipped." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          matrix=$(jq -c "$filter" .github/ci-matrix.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  R-CMD-check:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }}) ${{ matrix.config.label }}
    continue-on-error: ${{ matrix.config.allow-failure == true }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      # Take packages from a dated snapshot of CRAN instead of the latest.
      # RSPM (Linux binaries) and CRAN (source) are the two repositories
      # that setup-r puts in options(repos), so both point at the snapshot.
      # The snapshots do not serve CRAN's web area (web/packages/packages.rds),
      # which --as-cran reads to look for orphaned dependencies. R before 4.4
      # stops the whole check when it cannot read it, so R_CRAN_WEB points
      # that one read at CRAN itself.
      - name: Use a CRAN snapshot
        if: matrix.config.snapshot
        shell: bash
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          echo "RSPM=https://packagemanager.posit.co/cran/__linux__/${codename}/${{ matrix.config.snapshot }}" >> "$GITHUB_ENV"
          echo "CRAN=https://packagemanager.posit.co/cran/${{ matrix.config.snapshot }}" >> "$GITHUB_ENV"
          echo "R_CRAN_WEB=https://cloud.r-project.org" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: ${{ matrix.config.pandoc || '3.1.11' }}

      # So the test that renders a PDF with XeLaTeX runs. It is skipped
      # where LaTeX is not installed.
      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.config.latex

      # So the tests that render Quarto documents run. They are skipped
      # where Quarto is not installed.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ matrix.config.quarto || 'release' }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.extra }}
          needs: check

      # Shown in the log, so a failure can be matched to the versions used.
      - name: Package versions
        shell: Rscript {0}
        run: |
          pkgs <- c("ggplot2", "scales", "flextable", "officer", "gt", "gtsummary",
                    "reactable", "plotly", "DT", "leaflet", "bslib", "rmarkdown",
                    "knitr", "openxlsx2", "patchwork", "sf", "testthat")
          have <- pkgs[vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          print(vapply(have, function(p) as.character(utils::packageVersion(p)), ""))

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: ${{ matrix.config.error-on || '"warning"' }}
          upload-snapshots: true

      # check-r-package fails on the ERRORs, WARNINGs and NOTEs it finds in
      # the output, but not when R CMD check stops early ("Execution halted"),
      # which prints none of them. R CMD check writes its "Status:" line only
      # when it reaches the end.
      - name: Make sure R CMD check ran the tests and finished
        shell: bash
        run: |
          log=check/phwstyle.Rcheck/00check.log
          if ! grep -q '^\* checking tests' "$log"; then
            echo "::error::R CMD check did not run the tests. See the output of the check step above."
            exit 1
          fi
          if ! grep -q '^Status: ' "$log"; then
            echo "::error::R CMD check stopped before the end. See the output of the check step above."
            exit 1
          fi
