# Checks the ONS Open Geography Portal and DataMapWales once a month for new
# boundary releases (e.g. new wards or health boards) and opens a pull
# request updating inst/extdata/boundaries.csv when something changed.
# The R-CMD-check workflow then runs on that pull request.
on:
  schedule:
    - cron: '0 6 3 * *'
  workflow_dispatch:

name: update-boundaries

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::jsonlite
          dependencies: '"hard"'
      - name: Look for new boundary releases
        run: Rscript data-raw/boundaries.R
      - name: Summarise changes
        id: diff
        run: |
          {
            echo 'summary<<EOF'
            git diff --unified=0 inst/extdata/boundaries.csv | grep '^[-+]"' | cut -d, -f1,3,5 || true
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-boundaries
          commit-message: Update boundary releases
          title: Update boundary releases
          body: |
            New boundary releases were found on the ONS Open Geography Portal or DataMapWales.

            ```
            ${{ steps.diff.outputs.summary }}
            ```

            Check the new layers in a map before merging, and add a NEWS item.
          add-paths: inst/extdata/boundaries.csv
